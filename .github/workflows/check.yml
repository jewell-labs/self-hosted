name: check
on:
  push:
  pull_request:
jobs:
  refuse-public-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: actions-runner refuses a public repo
        run: |
          set -eu
          out="${RUNNER_TEMP:-/tmp}/actions-runner-setup.txt"
          if node bin/setup.mjs actions-runner >"$out" 2>&1; then
            echo "actions-runner setup succeeded on a public repo" >&2
            exit 1
          fi
          grep -q "refusing actions-runner: this repository is public" "$out"
